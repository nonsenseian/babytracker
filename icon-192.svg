  <path d="M256 112 C238 72 274 52 256 36 C238 52 274 82 256 112 Z" fill="#92400E" />

  <!-- Expressive Eyebrows -->
  <path d="M174 192 Q194 180 214 192" stroke="#92400E" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.65" />
  <path d="M298 192 Q318 180 338 192" stroke="#92400E" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.65" />

  <!-- Big Kawaii Eyes -->
  <!-- Left Eye -->
  <circle cx="194" cy="236" r="28" fill="#1E293B" />
  <circle cx="203" cy="226" r="10" fill="#FFFFFF" />
  <circle cx="187" cy="245" r="4.5" fill="#FFFFFF" />

  <!-- Right Eye -->
  <circle cx="318" cy="236" r="28" fill="#1E293B" />
  <circle cx="327" cy="226" r="10" fill="#FFFFFF" />
  <circle cx="311" cy="245" r="4.5" fill="#FFFFFF" />

  <!-- Rosy Cheeks -->
  <circle cx="146" cy="278" r="30" fill="#F472B6" opacity="0.45" />
  <circle cx="366" cy="278" r="30" fill="#F472B6" opacity="0.45" />

  <!-- Cute Large Pacifier In Mouth -->
  <!-- Ring Handle Hanging Below -->
  <path d="M230 324 C230 376 282 376 282 324" stroke="#0284C7" stroke-width="12" stroke-linecap="round" fill="none" />

  <!-- Pacifier Butterfly Shield -->
  <path d="M256 286 C290 270 326 286 322 310 C318 334 286 338 256 328 C226 338 194 334 190 310 C186 286 222 270 256 286 Z" fill="url(#paciGrad192)" stroke="#0284C7" stroke-width="2.5" />

  <!-- Ventilation Air Holes on Wings -->
  <circle cx="218" cy="310" r="5" fill="#FED7AA" opacity="0.85" />
  <circle cx="294" cy="310" r="5" fill="#FED7AA" opacity="0.85" />

  <!-- Center Pacifier Button / Grip -->
  <circle cx="256" cy="310" r="18" fill="#FFFFFF" stroke="#0284C7" stroke-width="2.5" />
