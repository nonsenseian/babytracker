<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="192" height="192">
  <defs>
    <linearGradient id="faceGrad192" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FED7AA" />
    </linearGradient>
    <linearGradient id="paciGrad192" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="softShadow192" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#78350F" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Background Flat Pastel Dark Orange Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="#E87A42" />

  <!-- Baby Face Circle with Warm Soft Shadow -->
  <circle cx="256" cy="256" r="185" fill="url(#faceGrad192)" filter="url(#softShadow192)" />

