name: Build NovaBaby iOS Native App (Cloud Mac Runner)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-ios:
    name: Build iOS Native Archive
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Production Assets
        run: npm run build

      - name: Synchronize Capacitor Native iOS Assets
        run: npx cap sync ios

      - name: Build iOS App Binary (Xcodebuild)
        run: |
          xcodebuild clean build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY=""

      - name: Package Unsigned / Development IPA
        run: |
          mkdir -p build/Payload build/App.xcarchive/Products/Applications
          APP_PATH=$(find build/DerivedData -name "App.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ Error: App.app was not found in DerivedData"
            exit 1
          fi
          echo "✅ Found compiled native application at $APP_PATH"
          cp -R "$APP_PATH" build/Payload/
          cp -R "$APP_PATH" build/App.xcarchive/Products/Applications/
          cd build && zip -r NovaBaby.ipa Payload/

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaBaby-iOS-IPA
          path: build/NovaBaby.ipa
          retention-days: 14
