name: Build NovaBaby iOS Native App (Cloud Mac Runner)

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS Native Archive
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Production Assets
        run: npm run build

      - name: Synchronize Capacitor Native iOS Assets
        run: npx cap sync ios

      - name: Build iOS Archive (Xcodebuild)
        run: |
          xcodebuild clean archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Unsigned / Development IPA
        run: |
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build && zip -r NovaBaby.ipa Payload/

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaBaby-iOS-IPA
          path: build/NovaBaby.ipa
          retention-days: 14
