<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>NovaBaby Logo</title>
  <defs>
    <!-- Background Twilight Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b6ccfe" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>

    <!-- Sun Ray Gradient: Warm Honey to Golden Amber -->
    <linearGradient id="rayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Sun Face Gradient: Soft Creamy Butter to Golden Warmth -->
    <radialGradient id="faceGrad" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="60%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fcd34d" />
    </radialGradient>
  </defs>

  <!-- iOS-Style Rounded Squircle Container -->
  <rect width="512" height="512" rx="112" fill="url(#skyGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.6" />

  <!-- Background Celestial Pastel Stars (Bold & Scalable at 16px) -->
  <!-- Top Right 4-Point Golden Star -->
  <path d="M 390 94 Q 390 114 410 114 Q 390 114 390 134 Q 390 114 370 114 Q 390 114 390 94 Z" fill="#fde047" />

  <!-- Bottom Left 4-Point Lavender Star -->
  <path d="M 120 374 Q 120 390 136 390 Q 120 390 120 406 Q 120 390 104 390 Q 120 390 120 374 Z" fill="#ddd6fe" />

  <!-- Ambient Clay Depth Glow -->
  <circle cx="256" cy="264" r="188" fill="#4338ca" opacity="0.14" />

  <!-- Cheerful Claymorphic Sun Rays (12 Soft Rounded Rays) -->
  <g>
    <rect x="238" y="74" width="36" height="88" rx="18" fill="url(#rayGrad)" transform="rotate(0 256 256)" />
    <rect x="238" y="74" width="36" height="88" rx="18" fill="url(#rayGrad)" transform="rotate(30 256 256)" />
    <rect x="238" y="74" width="36" height="88" rx="18" fill="url(#rayGrad)" transform="rotate(60 256 256)" />
    <rect x="238" y="74" width="36" height="88" rx="18" fill="url(#rayGrad)" transform="rotate(90 256 256)" />
    <rect x="238" y="74" width="36" height="88" rx="18" fill="url(#rayGrad)" transform="rotate(120 256 256)" />
    <rect x="238" y="74" width="36" height="88" rx="18" fill="url(#rayGrad)" transform="rotate(150 256 256)" />
    <rect x="238" y="74" width="36" height="88" rx="18" fill="url(#rayGrad)" transform="rotate(180 256 256)" />
    <rect x="238" y="74" width="36" height="88" rx="18" fill="url(#rayGrad)" transform="rotate(210 256 256)" />
    <rect x="238" y="74" width="36" height="88" rx="18" fill="url(#rayGrad)" transform="rotate(240 256 256)" />
    <rect x="238" y="74" width="36" height="88" rx="18" fill="url(#rayGrad)" transform="rotate(270 256 256)" />
    <rect x="238" y="74" width="36" height="88" rx="18" fill="url(#rayGrad)" transform="rotate(300 256 256)" />
    <rect x="238" y="74" width="36" height="88" rx="18" fill="url(#rayGrad)" transform="rotate(330 256 256)" />
  </g>

  <!-- Face Depth Bevel Shadow (Layered Vector) -->
  <circle cx="256" cy="264" r="126" fill="#b45309" opacity="0.22" />

  <!-- Sun Center Face Circle -->
  <circle cx="256" cy="256" r="124" fill="url(#faceGrad)" />

  <!-- Specular 3D Lighting Highlight on Forehead -->
  <path d="M 196 172 C 220 156 292 156 316 172" stroke="#ffffff" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.6" />

  <!-- Adorable Rosy Cheeks -->
  <ellipse cx="194" cy="280" rx="22" ry="14" fill="#fda4af" opacity="0.9" />
  <ellipse cx="318" cy="280" rx="22" ry="14" fill="#fda4af" opacity="0.9" />

  <!-- Sweet Happy Smiling Baby Eyes (Warm Espresso Brown) -->
  <path d="M 190 240 Q 210 216 230 240" stroke="#78350f" stroke-width="11" stroke-linecap="round" fill="none" />
  <path d="M 282 240 Q 302 216 322 240" stroke="#78350f" stroke-width="11" stroke-linecap="round" fill="none" />

  <!-- Cute Baby Button Nose -->
  <ellipse cx="256" cy="254" rx="9" ry="7" fill="#f59e0b" />

  <!-- Cheerful Warm Baby Smile -->
  <path d="M 232 274 Q 256 298 280 274" stroke="#78350f" stroke-width="9.5" stroke-linecap="round" fill="none" />
</svg>
